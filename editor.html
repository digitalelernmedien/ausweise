<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Steckbrief Editor DE/FR</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body { font-family: system-ui, sans-serif; background: #f5f6f7; margin:0; padding:1rem; }
  main { max-width: 1200px; margin:auto; background:#fff; padding:1rem; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
  h1 { margin-top:0; }

  select { width: 100%; padding:0.5rem; margin-bottom:1rem; }

  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:1rem; }
  .tabs button { padding:0.4rem 0.6rem; border:none; background:#e0e0e0; border-radius:6px; cursor:pointer; }
  .tabs button.active { background:#007AFF; color:white; font-weight:bold; }

  .editor-container { display:flex; gap:1rem; }
  .editor-column { flex:1; border:1px solid #ddd; border-radius:8px; padding:0.5rem; background:#fafafa; }

  .editor-column h3 { text-align:center; margin-top:0; }
  .entry { border:1px solid #ccc; border-radius:6px; padding:0.5rem; margin-bottom:0.5rem; background:white; }
  .entry label { font-size:0.75rem; color:#666; display:block; margin-top:0.3rem; }
  .entry input { width:100%; padding:0.4rem; margin-bottom:0.3rem; box-sizing:border-box; }

  .add-btn { margin-top:0.5rem; padding:0.5rem; background:#007AFF; color:white; border:none; border-radius:6px; cursor:pointer; width:100%; }

  /* ---------------- Action Bar für Buttons ---------------- */
  .action-bar {
    display: flex;
    gap: 1rem;           /* Abstand zwischen Buttons */
    margin-top: 2rem;    /* Abstand zur vorherigen Sektion */
  }

  .download-btn {
    padding: 0.6rem 1.2rem;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
    width: auto;         /* nicht full-width */
  }

  #newBtn {
    background: #007AFF; /* separater Stil für neuen Steckbrief */
  }

  #toggleZuordnungBtn {
    background:#6c757d;
    margin-top:1rem;
  }

</style>
</head>
<body>

<main>
  <h1>Steckbrief Editor DE/FR</h1>

  <!-- Auswahl -->
  <select id="recordSelect"></select>

  <!-- Tabs -->
  <div class="tabs" id="tabs"></div>

  <!-- Editor nebeneinander -->
  <div class="editor-container">
    <div class="editor-column" id="editor-de">
      <h3>Deutsch</h3>
    </div>
    <div class="editor-column" id="editor-fr">
      <h3>Französisch</h3>
    </div>
  </div>

  <!-- Toggle Zuordnung -->
  <button id="toggleZuordnungBtn">
    Karten-Steckbrief-Zuordnung anzeigen
  </button>
  <div id="zuordnungDiv" style="display:none; margin-top:0.5rem;"></div>

  <!-- Action Bar mit Buttons -->
  <div class="action-bar">
    <button id="newBtn">Neuen Steckbrief erstellen</button>
    <button id="downloadBtn">JSON herunterladen</button>
  </div>

</main>

<script src="editor.js"></script>
</body>
</html>
