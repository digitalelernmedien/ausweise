<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Antrag neuer Steckbrief – Szenariotraining</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: system-ui, sans-serif;
  background:#f5f6f7;
  margin:0;
  padding:1rem;
}
main {
  max-width: 900px;
  margin:auto;
  background:white;
  padding:1.5rem;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}
label {
  display:block;
  font-size:0.9rem;
  margin-top:0.5rem;
}
input, textarea {
  width:100%;
  padding:0.4rem;
  margin-top:0.2rem;
}
.db-json {
  font-size:0.8rem;
  color:#666;
  margin-left:0.25rem;
}
.entry {
  border:1px dashed #ccc;
  border-radius:6px;
  padding:0.6rem;
  margin:0.6rem 0;
  background:#fafafa;
}
.hide-json .db-json {
  display:none;
}
</style>
</head>

<body>
<main>

<h1>Antrag neuer Steckbrief – Szenariotraining</h1>

<h2>1. Szenario</h2>
<textarea rows="4"></textarea>

<h2>2. Angaben für den Ausweis</h2>
<fieldset>
  <label>Nachname <span class="db-json">(lastname)</span></label>
  <input type="text">

  <label>Vorname <span class="db-json">(firstname)</span></label>
  <input type="text">

  <label>Geburtsdatum <span class="db-json">(dob)</span></label>
  <input type="text" placeholder="TT.MM.JJJJ">

  <label>Herkunft <span class="db-json">(poo)</span></label>
  <input type="text">
</fieldset>

<h2>3. Gewünschte Datenbanken</h2>

<div class="db-toggle">
  <input type="checkbox" data-target="geres-section">
  <div>
    <strong>GERES – Personenregister</strong>
    <div class="db-json">(GERES)</div>
  </div>
</div>

<div class="entry" id="geres-section" hidden>
  <label>Nachname <span class="db-json">(lastname)</span></label>
  <input>

  <label>Vorname <span class="db-json">(firstname)</span></label>
  <input>

  <label>Geburtsdatum <span class="db-json">(dob)</span></label>
  <input>
</div>

<h2>4. Ausschlüsse</h2>
<textarea rows="3"></textarea>

<button id="exportBtn">Datei speichern</button>
<button id="toggleJsonHints">JSON-Begriffe ausblenden</button>

<script src="new.js"></script>

</main>
</body>
</html>
